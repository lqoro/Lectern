name: Feature request
description: Suggest something that would make Lectern more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or situation first (for example, "my professor uses a lot of anatomy terms").
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
